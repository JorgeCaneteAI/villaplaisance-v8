---
deployment:
  tasks:
    # Repo qui sert la PROD villaplaisance.fr (depuis la bascule du 2026-06-03).
    # Le repo s'appelle encore "villaplaisance-v8" pour des raisons historiques
    # mais sert la prod. Le repo v7 (villaplaisance-v7) est archivé, ne plus
    # toucher. Cible serveur : /home/efkz3012/villaplaisance.fr/
    - export DEPLOYPATH=/home/efkz3012/villaplaisance.fr/
    - /bin/cp -R * $DEPLOYPATH
    # public/.htaccess est le routeur principal — on le laisse intact.
    # Le .htaccess racine (125b, juste "redirige vers /public/") est inutile
    # ici puisque le DocumentRoot Apache pointe directement sur public/.
    - chmod -R 755 $DEPLOYPATH
